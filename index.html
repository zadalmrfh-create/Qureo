<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>منصة كيرو - إدارة الحسابات</title>
    <style>
        body {
            font-family: "Cairo", sans-serif;
            background-color: #f9f9f9;
            color: #333;
            text-align: center;
            padding: 30px;
        }
        h1 {
            color: #0077cc;
            margin-bottom: 20px;
        }
        table {
            border-collapse: collapse;
            width: 90%;
            margin: 0 auto;
            background-color: #fff;
            box-shadow: 0 0 10px rgba(0,0,0,0.1);
        }
        th, td {
            border: 1px solid #ddd;
            padding: 12px;
        }
        th {
            background-color: #0077cc;
            color: white;
        }
        tr:nth-child(even) {
            background-color: #f2f2f2;
        }
        input {
            width: 100%;
            border: none;
            background: transparent;
            text-align: center;
        }
    </style>
</head>
<body>

    <h1>منصة كيرو - إدارة الحسابات</h1>

    <table>
        <thead>
            <tr>
                <th>الاسم</th>
                <th>الفصول المطلوبة</th>
                <th>الفصول المتبقية</th>
                <th>المبلغ المطلوب</th>
                <th>السداد</th>
                <th>الكود</th>
                <th>الترتيب</th>
            </tr>
        </thead>
        <tbody>
            <!-- صف فارغ لإدخال البيانات -->
            <tr>
                <td><input type="text" placeholder="اكتب الاسم"></td>
                <td><input type="number" placeholder="عدد الفصول المطلوبة"></td>
                <td><input type="number" placeholder="عدد الفصول المتبقية"></td>
                <td><input type="number" placeholder="المبلغ المطلوب"></td>
                <td><input type="number" placeholder="المبلغ المدفوع"></td>
                <td><input type="text" placeholder="الكود"></td>
                <td><input type="number" placeholder="الترتيب"></td>
            </tr>
        </tbody>
    </table>

</body>
</html>
